; ============================================================
;  PRUEBA DE ALCANCE CC1101 — ESP32 + pulsador + LED + buzzer
;
;  Mismo codigo en todas las placas; el ROL y el ID los pone el entorno:
;     base    -> NODE_ID=0, ES_BASE=1  la CENTRAL (va enchufada a la PC con la pagina)
;     handy1  -> NODE_ID=1, ES_BASE=0  handy del residente 1
;     handy2  -> NODE_ID=2, ES_BASE=0  handy del residente 2 (si hay otra placa)
;  Para mas residentes: copiar un [env:handyN] con NODE_ID=N (1..18).
;
;  Compilar/flashear (una placa a la vez, cada una con su entorno):
;     pio run -e base   -t upload --upload-port COMx
;     pio run -e handy1 -t upload --upload-port COMy
;     pio device monitor
;
;  Solo compilar:  pio run -e base -e handy1
; ============================================================

[env]
; prueba_hw.cpp es un programa de diagnostico aparte: no entra en el firmware
build_src_filter = +<*> -<prueba_hw.cpp>
platform      = espressif32
board         = nodemcu-32s
framework     = arduino
monitor_speed = 921600
lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib

[env:base]
build_flags = -D NODE_ID=0 -D ES_BASE=1

[env:handy1]
build_flags = -D NODE_ID=1 -D ES_BASE=0

[env:handy2]
build_flags = -D NODE_ID=2 -D ES_BASE=0

; Programa minimo para probar el hardware de audio de una placa, sin radio ni
; codec ni watchdog. Ver el encabezado de src/prueba_hw.cpp.
;   pio run -e prueba_audio -t upload --upload-port COM5
[env:prueba_audio]
build_src_filter = -<*> +<prueba_hw.cpp>
build_flags = -D NODE_ID=1
