; ============================================================
;  PRUEBA DE ALCANCE CC1101 — ESP32 + pulsador + LED + buzzer
;
;  Firmware SIMETRICO: las dos placas corren el mismo codigo.
;  Lo unico que cambia es NODE_ID, que ya NO se edita a mano en
;  Config.h: lo define el entorno (nodo1 / nodo2) con -D NODE_ID.
;
;  Compilar/flashear (una placa a la vez, cada una con su entorno):
;     pio run -e nodo1 -t upload --upload-port COM5
;     pio run -e nodo2 -t upload --upload-port <COM de la otra placa>
;     pio device monitor
;
;  Solo compilar ambas:  pio run -e nodo1 -e nodo2
; ============================================================

[env]
; prueba_hw.cpp es un programa de diagnostico aparte: no entra en el firmware
build_src_filter = +<*> -<prueba_hw.cpp>
platform      = espressif32
board         = nodemcu-32s
framework     = arduino
monitor_speed = 115200
lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib

[env:nodo1]
build_flags = -D NODE_ID=1

[env:nodo2]
build_flags = -D NODE_ID=2

; Programa minimo para probar el hardware de audio de una placa, sin radio ni
; codec ni watchdog. Ver el encabezado de src/prueba_hw.cpp.
;   pio run -e prueba_audio -t upload --upload-port COM5
[env:prueba_audio]
build_src_filter = -<*> +<prueba_hw.cpp>
build_flags = -D NODE_ID=1
